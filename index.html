<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAvD91Eh5wNlV8zemA2JQb5eE_qfuh5GM0",
    authDomain: "notion-savings.firebaseapp.com",
    projectId: "notion-savings",
    storageBucket: "notion-savings.firebasestorage.app",
    messagingSenderId: "460511400300",
    appId: "1:460511400300:web:7cac15a17b0e60d2c36349",
    measurementId: "G-QJEB3LVBSV"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const docRef = doc(db, "savings", "shared");

  let savings = 0;
  let history = [];

  const totalEl = document.getElementById("total");
  const inputEl = document.getElementById("amountInput");
  const historyEl = document.getElementById("history");

  async function loadData() {
    const snap = await getDoc(docRef);
    if (snap.exists()) {
      const data = snap.data();
      savings = data.savings || 0;
      history = data.history || [];
      render();
    }
  }

  function saveData() {
    setDoc(docRef, { savings, history });
  }

  function deposit() {
    applyChange("Deposit", Number(inputEl.value));
  }

  function deduct() {
    applyChange("Deduct", -Number(inputEl.value));
  }

  function applyChange(type, amount) {
    if (!amount) return;

    savings += amount;
    history.push({ type, amount, balance: savings });
    saveData();
    inputEl.value = "";
  }

  function undo() {
    if (!history.length) return;
    history.pop();
    savings = history.length ? history.at(-1).balance : 0;
    saveData();
  }

  function render() {
    totalEl.textContent = `₱${savings.toLocaleString()}`;
    totalEl.className = "amount " + (savings >= 0 ? "positive" : "negative");

    historyEl.innerHTML = "";
    history.slice(-3).reverse().forEach(h => {
      historyEl.innerHTML += `
        <tr>
          <td>${h.type}</td>
          <td>${h.amount > 0 ? "+" : ""}₱${Math.abs(h.amount)}</td>
          <td>₱${h.balance.toLocaleString()}</td>
        </tr>`;
    });
  }

  onSnapshot(docRef, snap => {
    if (snap.exists()) {
      const data = snap.data();
      savings = data.savings;
      history = data.history;
      render();
    }
  });

  loadData();
</script>
