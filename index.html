<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Savings Tracker</title>

<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg);
}

:root {
  --bg: #ffffff;
  --card: #f5f5f7;
  --text: #111;
  --muted: #666;
  --danger: #ff3b30;
  --border: rgba(0,0,0,0.1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --card: #2c2c2e;
    --text: #ffffff;
    --muted: #aaaaaa;
    --border: rgba(255,255,255,0.1);
  }
}

* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  padding: 16px;
}

.card {
  background: var(--card);
  color: var(--text);
  width: 100%;
  max-width: 340px;
  border-radius: 24px;
  padding: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}

.tab {
  flex: 1;
  padding: 8px 0;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  background: var(--bg);
  color: var(--muted);
  border: 1px solid var(--border);
}

.tab.active[data-bank="gcash"] { background:#0079F6;color:#fff;border:0 }
.tab.active[data-bank="gotyme"]{ background:#0EE9F3;color:#000;border:0 }
.tab.active[data-bank="maribank"]{ background:#E45D04;color:#fff;border:0 }

/* Total */
.total {
  text-align: center;
  margin-bottom: 16px;
}

#total {
  font-size: 44px;
  font-weight: 800;
}

.currency {
  display: block;
  font-size: 13px;
  color: var(--muted);
}

/* Inputs */
.input-group {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
}

button {
  padding: 10px;
  border-radius: 14px;
  border: none;
  font-weight: 600;
  cursor: pointer;
}

.deposit { flex:1;background:#007aff;color:#fff }
.withdraw { flex:1;background:var(--danger);color:#fff }

.undo {
  width: 100%;
  margin-top: 8px;
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--muted);
}

.history {
  margin-top: 14px;
  font-size: 12px;
  flex: 1;               /* Take remaining space */
  overflow-y: auto;      /* Scroll if too many entries */
  max-height: 180px;     /* Optional: limit visible height */
  padding-right: 4px;    
}

.entry {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
</style>
</head>

<body>
<div class="card">

  <div class="tabs">
    <div class="tab active" data-bank="gcash">GCash</div>
    <div class="tab" data-bank="gotyme">GoTyme</div>
    <div class="tab" data-bank="maribank">MariBank</div>
  </div>

  <div class="total">
    ₱<span id="total">0</span>
    <span class="currency" id="bankName">GCash</span>
  </div>

  <div class="input-group">
    <input type="number" id="amount" placeholder="Enter amount">
  </div>

  <div class="input-group">
    <button class="deposit" id="depositBtn">Deposit</button>
    <button class="withdraw" id="withdrawBtn">Deduct</button>
  </div>

  <button class="undo" id="undoBtn">Undo</button>

  <div class="history" id="history"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAvD91Eh5wNlV8zemA2JQb5eE_qfuh5GM0",
  authDomain: "notion-savings.firebaseapp.com",
  projectId: "notion-savings"
});

const db = getFirestore(app);

const cache = { gcash:null, gotyme:null, maribank:null };
let currentBank = "gcash";
let unsub = null;

const totalEl = document.getElementById("total");
const historyEl = document.getElementById("history");
const bankNameEl = document.getElementById("bankName");
const amountEl = document.getElementById("amount");

const ref = b => doc(db, "savings", b);

function render(bank) {
  const d = cache[bank];
  if (!d) return;

  totalEl.textContent = d.totalSavings.toLocaleString();
  historyEl.innerHTML = "";

  d.transactions.slice(-10).reverse().forEach(t => {
    historyEl.innerHTML +=
      `<div class="entry"><span>${t.type}</span><span>${t.amount > 0 ? "+" : ""}${t.amount}</span></div>`;
  });
}

function listen(bank) {
  if (unsub) unsub();

  unsub = onSnapshot(ref(bank), snap => {
    if (!snap.exists()) {
      setDoc(ref(bank), { totalSavings: 0, transactions: [] });
      return;
    }
    cache[bank] = snap.data();
    render(bank);
  });
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");

    currentBank = tab.dataset.bank;
    bankNameEl.textContent = tab.textContent;

    if (cache[currentBank]) render(currentBank);
    listen(currentBank);
  };
});

async function add(amount) {
  if (!amount) return;
  const d = cache[currentBank];

  await updateDoc(ref(currentBank), {
    totalSavings: d.totalSavings + amount,
    transactions: [...d.transactions, {
      amount,
      type: amount > 0 ? "Deposit" : "Deduction",
      timestamp: Date.now()
    }]
  });

  amountEl.value = "";
}

depositBtn.onclick = () => add(Math.abs(+amountEl.value));
withdrawBtn.onclick = () => add(-Math.abs(+amountEl.value));

undoBtn.onclick = async () => {
  const d = cache[currentBank];
  if (!d.transactions.length) return;
  const last = d.transactions.at(-1);

  await updateDoc(ref(currentBank), {
    totalSavings: d.totalSavings - last.amount,
    transactions: d.transactions.slice(0, -1)
  });
};

/* Initial load */
listen(currentBank);
</script>

</body>
</html>
