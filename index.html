<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Savings Tracker</title>

<style>
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

:root {
  --bg: #ffffff;
  --card: #f5f5f7;
  --text: #111;
  --muted: #666;
  --danger: #ff3b30;
  --border: rgba(0,0,0,0.1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --card: #2c2c2e;
    --text: #ffffff;
    --muted: #aaaaaa;
    --border: rgba(255,255,255,0.1);
  }
}

* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  background: transparent;
  margin: 0;
  padding: 16px;
  display: flex;
  justify-content: center;
}

.card {
  background: var(--card);
  color: var(--text);
  width: 100%;
  max-width: 340px;
  border-radius: 24px;
  padding: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  overflow: hidden;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}

.tab {
  flex: 1;
  padding: 8px 0;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  background: var(--bg);
  color: var(--muted);
  border: 1px solid var(--border);
}

.tab.active[data-bank="gcash"] {
  background: #0079F6;
  color: #fff;
  border-color: transparent;
}

.tab.active[data-bank="gotyme"] {
  background: #0EE9F3;
  color: #000;
  border-color: transparent;
}

.tab.active[data-bank="maribank"] {
  background: #E45D04;
  color: #fff;
  border-color: transparent;
}

/* ===== BIG SAVINGS VALUE ===== */
.total {
  text-align: center;
  margin-bottom: 16px;
}

.total span#total {
  font-size: 44px;      /* 🔥 bigger number */
  font-weight: 800;
  letter-spacing: -0.5px;
}

.currency {
  display: block;
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
}

/* Inputs */
.input-group {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}

button {
  padding: 10px;
  border-radius: 14px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.deposit {
  flex: 1;
  background: #007aff;
  color: #fff;
}

.withdraw {
  flex: 1;
  background: var(--danger);
  color: #fff;
}

.undo {
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--muted);
  margin-top: 8px;
}

.history {
  margin-top: 14px;
  font-size: 12px;
}

.entry {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
</style>
</head>

<body>

<div class="card">

  <div class="tabs">
    <div class="tab active" data-bank="gcash">GCash</div>
    <div class="tab" data-bank="gotyme">GoTyme</div>
    <div class="tab" data-bank="maribank">MariBank</div>
  </div>

  <div class="total">
    ₱<span id="total">0</span>
    <span class="currency" id="bankName">GCash</span>
  </div>

  <div class="input-group">
    <input type="number" id="amount">
  </div>

  <div class="input-group">
    <button class="deposit" id="depositBtn">Deposit</button>
    <button class="withdraw" id="withdrawBtn">Deduct</button>
  </div>

  <button class="undo" id="undoBtn">Undo</button>

  <div class="history">
    <div id="history"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  updateDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvD91Eh5wNlV8zemA2JQb5eE_qfuh5GM0",
  authDomain: "notion-savings.firebaseapp.com",
  projectId: "notion-savings",
  storageBucket: "notion-savings.firebasestorage.app",
  messagingSenderId: "460511400300",
  appId: "1:460511400300:web:7cac15a17b0e60d2c36349"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const cache = {
  gcash: { totalSavings: 0, transactions: [] },
  gotyme: { totalSavings: 0, transactions: [] },
  maribank: { totalSavings: 0, transactions: [] }
};

let currentBank = "gcash";
let unsubscribe = null;

const totalEl = document.getElementById("total");
const historyEl = document.getElementById("history");
const bankNameEl = document.getElementById("bankName");
const amountInput = document.getElementById("amount");

function bankRef(bank) {
  return doc(db, "savings", bank);
}

function listenBank(bank) {
  if (unsubscribe) unsubscribe();
  unsubscribe = onSnapshot(bankRef(bank), snap => {
    if (!snap.exists()) {
      setDoc(bankRef(bank), { totalSavings: 0, transactions: [] });
      return;
    }
    cache[bank] = snap.data();
    if (bank === currentBank) render(bank);
  });
}

function render(bank) {
  const data = cache[bank];
  totalEl.textContent = data.totalSavings.toLocaleString();
  historyEl.innerHTML = "";
  data.transactions.slice(-3).reverse().forEach(t => {
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = `<span>${t.type}</span><span>${t.amount > 0 ? "+" : ""}${t.amount}</span>`;
    historyEl.appendChild(div);
  });
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");

    currentBank = tab.dataset.bank;
    bankNameEl.textContent = tab.textContent;

    render(currentBank);
    listenBank(currentBank);
  };
});

async function addTransaction(amount) {
  if (!amount) return;
  const data = cache[currentBank];

  await updateDoc(bankRef(currentBank), {
    totalSavings: data.totalSavings + amount,
    transactions: [...data.transactions, {
      amount,
      type: amount > 0 ? "Deposit" : "Deduction",
      timestamp: Date.now()
    }]
  });

  amountInput.value = "";
}

depositBtn.onclick = () => addTransaction(Math.abs(+amountInput.value));
withdrawBtn.onclick = () => addTransaction(-Math.abs(+amountInput.value));

undoBtn.onclick = async () => {
  const data = cache[currentBank];
  if (!data.transactions.length) return;
  const last = data.transactions.at(-1);

  await updateDoc(bankRef(currentBank), {
    totalSavings: data.totalSavings - last.amount,
    transactions: data.transactions.slice(0, -1)
  });
};

["gcash","gotyme","maribank"].forEach(listenBank);
</script>

</body>
</html>
