<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Savings Tracker</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    font-family: Inter, Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
  }

  h3 {
    margin: 0;
    font-size: 16px;
    opacity: 0.8;
  }

  .amount {
    font-size: 36px;
    font-weight: bold;
    margin: 12px 0;
  }

  .positive { color: #22c55e; }
  .negative { color: #ef4444; }

  input {
    width: 150px;
    padding: 8px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    text-align: center;
    margin-bottom: 10px;
  }

  button {
    margin: 4px;
    padding: 8px 14px;
    font-size: 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }

  .deposit { background: #22c55e; color: #052e16; }
  .deduct { background: #ef4444; color: #450a0a; }
  .undo { background: #64748b; color: white; }

  table {
    width: 100%;
    margin-top: 12px;
    border-collapse: collapse;
    font-size: 13px;
  }

  th, td {
    padding: 6px;
    border-bottom: 1px solid #334155;
  }

  th {
    opacity: 0.7;
  }
</style>
</head>

<body>

<h3>Savings</h3>
<div id="total" class="amount">₱0</div>

<input type="number" id="amountInput" placeholder="Enter amount">

<br>

<button class="deposit" onclick="deposit()">➕ Deposit</button>
<button class="deduct" onclick="deduct()">➖ Deduct</button>
<button class="undo" onclick="undo()">↩ Undo</button>

<table>
  <thead>
    <tr>
      <th>Type</th>
      <th>Amount</th>
      <th>Balance</th>
    </tr>
  </thead>
  <tbody id="history"></tbody>
</table>

<script>
  let savings = Number(localStorage.getItem("savings")) || 0;
  let history = JSON.parse(localStorage.getItem("history")) || [];

  const totalEl = document.getElementById("total");
  const inputEl = document.getElementById("amountInput");
  const historyEl = document.getElementById("history");

  function deposit() {
    applyChange("Deposit", Number(inputEl.value));
  }

  function deduct() {
    applyChange("Deduct", -Number(inputEl.value));
  }

  function applyChange(type, amount) {
    if (!amount) return;

    savings += amount;

    history.push({
      type,
      amount: amount,
      balance: savings
    });

    save();
    render();
    inputEl.value = "";
  }

  function undo() {
    if (history.length === 0) return;

    history.pop();
    savings = history.length ? history[history.length - 1].balance : 0;

    save();
    render();
  }

  function save() {
    localStorage.setItem("savings", savings);
    localStorage.setItem("history", JSON.stringify(history));
  }

  function render() {
    totalEl.textContent = `₱${savings.toLocaleString()}`;
    totalEl.className = "amount " + (savings >= 0 ? "positive" : "negative");

    historyEl.innerHTML = "";
    history.slice(-3).reverse().forEach(entry => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${entry.type}</td>
        <td>${entry.amount > 0 ? "+" : ""}₱${Math.abs(entry.amount)}</td>
        <td>₱${entry.balance}</td>
      `;
      historyEl.appendChild(row);
    });
  }

  render();
</script>

</body>
</html>
